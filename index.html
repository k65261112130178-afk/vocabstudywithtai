        { id: 73, word: "target", pos: "noun", vietnamese: "mục tiêu", example: "The old satellite was the target of a cleanup test mission.", exampleVi: "Vệ tinh cũ là mục tiêu của một sứ mệnh thử nghiệm dọn dẹp." },
        { id: 74, word: "giant", pos: "adj", vietnamese: "khổng lồ", example: "Engineers developed a giant net to capture defunct satellites.", exampleVi: "Các kỹ sư đã phát triển một tấm lưới khổng lồ để bắt các vệ tinh hỏng." },
        { id: 75, word: "trouble", pos: "noun", vietnamese: "rắc rối", example: "Space junk creates serious trouble for future satellite launches.", exampleVi: "Rác vũ trụ gây ra rắc rối nghiêm trọng cho các đợt phóng vệ tinh tương lai." },
        { id: 76, word: "intention", pos: "noun", vietnamese: "ý định", example: "Their primary intention is to remove dangerous debris from orbit.", exampleVi: "Ý định chính của họ là loại bỏ rác thải nguy hiểm khỏi quỹ đạo." },
        { id: 77, word: "vast", pos: "adj", vietnamese: "rộng lớn, bao la", example: "Space is vast, but satellite paths are tightly concentrated.", exampleVi: "Vũ trụ rất rộng lớn, nhưng các đường bay vệ tinh lại tập trung rất dày." },
        { id: 78, word: "safely", pos: "adv", vietnamese: "một cách an toàn", example: "Debris must be guided back down to burn safely in Earth's atmosphere.", exampleVi: "Rác phải được dẫn đường trở lại để bốc cháy một cách an toàn trong khí quyển." },
        { id: 79, word: "precision", pos: "noun", vietnamese: "sự chính xác", example: "Predicting satellite motion requires extreme precision.", exampleVi: "Dự đoán chuyển động vệ tinh đòi hỏi sự chính xác cực cao." },
        { id: 80, word: "resource", pos: "noun", vietnamese: "tài nguyên", example: "Clean outer space is a vital natural resource for humanity.", exampleVi: "Không gian vũ trụ sạch là một tài nguyên thiên nhiên vô cùng quan trọng." }
      ]
    };

    // Storage Keys
    const LESSONS_STORAGE_KEY = "vocab_app_folders_v2";
    const OLD_STORAGE_KEY = "vocab_app_custom_words_v1";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    const getStoredCustomLessons = () => {
      try {
        const stored = localStorage.getItem(LESSONS_STORAGE_KEY);
        if (stored) return JSON.parse(stored);

        // Auto-migration for legacy single-list custom words
        const oldCustomWords = localStorage.getItem(OLD_STORAGE_KEY);
        if (oldCustomWords) {
          const parsed = JSON.parse(oldCustomWords);
          if (Array.isArray(parsed) && parsed.length > 0) {
            const migratedFolder = [{
              id: "migrated-folder-1",
              title: "My Saved Vocabulary",
              words: parsed
            }];
            localStorage.setItem(LESSONS_STORAGE_KEY, JSON.stringify(migratedFolder));
            return migratedFolder;
          }
        }
        return [];
      } catch (e) {
        return [];
      }
    };

    const saveCustomLessonsToStorage = (lessons) => {
      try {
        localStorage.setItem(LESSONS_STORAGE_KEY, JSON.stringify(lessons));
      } catch (e) {}
    };

    function shuffleArray(arr) {
      const array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function App() {
      const [isAppReady, setIsAppReady] = useState(false);
      const [user, setUser] = useState(null);
      const [db, setDb] = useState(null);

      const [view, setView] = useState('welcome'); // welcome, quiz, summary, add-vocab, manage-folders
      const [customLessons, setCustomLessons] = useState([]);
      const [selectedLessonId, setSelectedLessonId] = useState('all');
      const [mode, setMode] = useState('en-vi'); 
      const [countOption, setCountOption] = useState(15); 
      const [quizStyle, setQuizStyle] = useState('mixed'); // mixed, mcq, typing, fill, flashcard
      const [notification, setNotification] = useState(null);

      // State for Folder & Word Inspection
      const [inspectedFolderId, setInspectedFolderId] = useState(null);
      const [newFolderName, setNewFolderName] = useState('');

      // State for Add Vocab Form
      const [targetFolderId, setTargetFolderId] = useState('');
      const [newWord, setNewWord] = useState('');
      const [newPos, setNewPos] = useState('noun');
      const [newVietnamese, setNewVietnamese] = useState('');
      const [newExample, setNewExample] = useState('');
      const [newExampleVi, setNewExampleVi] = useState('');

      useEffect(() => {
        if (!firebaseConfig) {
          const lessons = getStoredCustomLessons();
          setCustomLessons(lessons);
          setIsAppReady(true);
        }
      }, []);

      useEffect(() => {
        const initFirebase = async () => {
          if (!window.FB) return;
          if (!firebaseConfig) return;
          
          try {
            const app = window.FB.initializeApp(firebaseConfig);
            const auth = window.FB.getAuth(app);
            const firestoreDb = window.FB.getFirestore(app);
            setDb(firestoreDb);

            if (initialAuthToken) {
              await window.FB.signInWithCustomToken(auth, initialAuthToken);
            } else {
              await window.FB.signInAnonymously(auth);
            }

            window.FB.onAuthStateChanged(auth, (currentUser) => {
              if (currentUser) {
                setUser(currentUser);
              }
            });
          } catch (e) {
            console.error("Firebase init error:", e);
            showToast("Failed to connect to cloud storage.", "error");
            setIsAppReady(true);
          }
        };

        if (window.FB) {
          initFirebase();
        } else {
          window.addEventListener('firebase_modules_loaded', initFirebase);
          return () => window.removeEventListener('firebase_modules_loaded', initFirebase);
        }
      }, []);

      useEffect(() => {
        if (!user || !db) return;

        const foldersRef = window.FB.collection(db, 'artifacts', appId, 'users', user.uid, 'folders');
        
        const unsubscribe = window.FB.onSnapshot(foldersRef, (snapshot) => {
          const loadedFolders = [];
          snapshot.forEach(doc => {
            loadedFolders.push({ id: doc.id, ...doc.data() });
          });
          
          if (loadedFolders.length === 0) {
             // Auto-migrate local data to the cloud on first run
             const local = getStoredCustomLessons();
             if (local && local.length > 0) {
                local.forEach(folder => {
                   const docRef = window.FB.doc(db, 'artifacts', appId, 'users', user.uid, 'folders', folder.id);
                   window.FB.setDoc(docRef, folder);
                });
             }
          } else {
            setCustomLessons(loadedFolders);
          }
          setIsAppReady(true);
        }, (error) => {
          console.error("Firestore sync error:", error);
          showToast("Error syncing data.", "error");
          setIsAppReady(true); 
        });

        return () => unsubscribe();
      }, [user, db]);

      // Combine built-in lesson + custom lessons
      const allLessons = useMemo(() => {
        return [BUILTIN_LESSON_1, ...customLessons];
      }, [customLessons]);

      // Set default target folder for Add Vocab Form when lessons change
      useEffect(() => {
        if (!targetFolderId && customLessons.length > 0) {
          setTargetFolderId(customLessons[0].id);
        }
      }, [customLessons, targetFolderId]);

      // Computed active vocabulary list based on selected filter
      const activeVocabList = useMemo(() => {
        if (selectedLessonId === 'all') {
          return allLessons.flatMap(l => l.words);
        }
        const found = allLessons.find(l => l.id === selectedLessonId);
        return found ? found.words : [];
      }, [allLessons, selectedLessonId]);

      const showToast = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3000);
      };

      const handleCreateFolder = async (e) => {
        e?.preventDefault();
        const trimmed = newFolderName.trim();
        if (!trimmed) {
          showToast("Please enter a lesson/folder title.", "error");
          return;
        }

        const newFolder = {
          id: `custom-folder-${Date.now()}`,
          title: trimmed,
          words: []
        };

        const updated = [...customLessons, newFolder];
        setCustomLessons(updated);
        
        if (user && db) {
          const docRef = window.FB.doc(db, 'artifacts', appId, 'users', user.uid, 'folders', newFolder.id);
          await window.FB.setDoc(docRef, newFolder);
        } else {
          saveCustomLessonsToStorage(updated);
        }
        
        setNewFolderName('');
        setTargetFolderId(newFolder.id);
        showToast(`Folder "${trimmed}" created!`);
      };

      const handleDeleteFolder = async (folderId) => {
        const folder = customLessons.find(f => f.id === folderId);
        if (!folder) return;

        const updated = customLessons.filter(f => f.id !== folderId);
        setCustomLessons(updated);
        
        if (user && db) {
          const docRef = window.FB.doc(db, 'artifacts', appId, 'users', user.uid, 'folders', folderId);
          await window.FB.deleteDoc(docRef);
        } else {
          saveCustomLessonsToStorage(updated);
        }

        if (selectedLessonId === folderId) setSelectedLessonId('all');
        if (inspectedFolderId === folderId) setInspectedFolderId(null);
        showToast(`Folder "${folder.title}" deleted.`);
      };

      const handleAddCustomWord = async (e) => {
        e.preventDefault();
        if (!newWord || !newVietnamese) {
          showToast("Please enter both the word and its Vietnamese meaning.", "error");
          return;
        }

        let destFolderId = targetFolderId;
        let currentLessons = [...customLessons];
        let folderToUpdate = null;

        if (!destFolderId || destFolderId === 'new') {
          const defaultFolderName = `Custom Lesson ${customLessons.length + 1}`;
          folderToUpdate = {
            id: `custom-folder-${Date.now()}`,
            title: defaultFolderName,
            words: []
          };
          currentLessons.push(folderToUpdate);
          destFolderId = folderToUpdate.id;
        } else {
          folderToUpdate = currentLessons.find(f => f.id === destFolderId);
        }

        if (!folderToUpdate) return;

        const newEntry = {
          id: Date.now(),
          word: newWord.trim(),
          pos: newPos,
          vietnamese: newVietnamese.trim(),
          example: newExample.trim() || `This is an example sentence for ${newWord.trim()}.`,
          exampleVi: newExampleVi.trim() || `Đây là ví dụ cho từ ${newWord.trim()}.`
        };

        const updatedFolder = { ...folderToUpdate, words: [newEntry, ...folderToUpdate.words] };

        const updatedLessons = currentLessons.map(folder => {
          if (folder.id === destFolderId) {
            return updatedFolder;
          }
          return folder;
        });

        setCustomLessons(updatedLessons);

        if (user && db) {
           const docRef = window.FB.doc(db, 'artifacts', appId, 'users', user.uid, 'folders', updatedFolder.id);
           await window.FB.setDoc(docRef, updatedFolder);
        } else {
           saveCustomLessonsToStorage(updatedLessons);
        }

        showToast(`"${newWord}" saved to folder!`);

        setNewWord('');
        setNewVietnamese('');
        setNewExample('');
        setNewExampleVi('');
      };

      const handleDeleteWordFromFolder = async (folderId, wordId) => {
        let updatedFolder = null;
        const updatedLessons = customLessons.map(folder => {
          if (folder.id === folderId) {
            updatedFolder = { ...folder, words: folder.words.filter(w => w.id !== wordId) };
            return updatedFolder;
          }
          return folder;
        });

        setCustomLessons(updatedLessons);
        
        if (user && db && updatedFolder) {
           const docRef = window.FB.doc(db, 'artifacts', appId, 'users', user.uid, 'folders', folderId);
           await window.FB.setDoc(docRef, updatedFolder);
        } else {
           saveCustomLessonsToStorage(updatedLessons);
        }
        
        showToast("Word removed from folder.");
      };

      const [queue, setQueue] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isAnswered, setIsAnswered] = useState(false);
      const [answerResult, setAnswerResult] = useState(null);
      const [stats, setStats] = useState({ correct: 0, incorrect: 0, retriesTotal: 0 });
      const [missedWords, setMissedWords] = useState(new Set());
      
      const [currentOptions, setCurrentOptions] = useState([]);
      const [selectedOption, setSelectedOption] = useState(null);
      const [inputValue, setInputValue] = useState('');
      const [flashcardRevealed, setFlashcardRevealed] = useState(false);
      
      const inputRef = useRef(null);

      const startQuiz = () => {
        if (activeVocabList.length === 0) {
          showToast("No vocabulary available in the selected folder!", "error");
          return;
        }

        let selectedList = shuffleArray(activeVocabList);
        if (countOption !== 'all' && Number(countOption) < selectedList.length) {
          selectedList = selectedList.slice(0, Number(countOption));
        }

        const activeRecallTypes = ['mcq', 'typing', 'fill', 'flashcard'];

        const initialQueue = selectedList.map(item => {
          let assignedType = quizStyle;
          if (quizStyle === 'mixed') {
            assignedType = activeRecallTypes[Math.floor(Math.random() * activeRecallTypes.length)];
          }
          return {
            vocab: item,
            isRetry: false,
            retryCount: 0,
            qType: assignedType
          };
        });

        setQueue(initialQueue);
        setCurrentIndex(0);
        resetQuestionState();
        setStats({ correct: 0, incorrect: 0, retriesTotal: 0 });
        setMissedWords(new Set());
        setView('quiz');
      };

      const resetQuestionState = () => {
        setIsAnswered(false);
        setAnswerResult(null);
        setSelectedOption(null);
        setInputValue('');
        setFlashcardRevealed(false);
        if (inputRef.current) setTimeout(() => inputRef.current.focus(), 50);
      };

      const currentItem = queue[currentIndex];

      useEffect(() => {
        if (!currentItem || view !== 'quiz') return;
        resetQuestionState();

        if (currentItem.qType === 'mcq') {
          const targetVocab = currentItem.vocab;
          const pool = activeVocabList.length >= 4 ? activeVocabList : BUILTIN_LESSON_1.words;
          const distractors = shuffleArray(pool.filter(v => v.id !== targetVocab.id)).slice(0, 3);
          
          let choices = [];
          if (mode === 'en-vi') {
            choices = [
              { id: targetVocab.id, text: targetVocab.vietnamese, isCorrect: true },
              ...distractors.map(d => ({ id: d.id, text: d.vietnamese, isCorrect: false }))
            ];
          } else {
            choices = [
              { id: targetVocab.id, text: targetVocab.word, isCorrect: true },
              ...distractors.map(d => ({ id: d.id, text: d.word, isCorrect: false }))
            ];
          }
          setCurrentOptions(shuffleArray(choices));
        }
      }, [currentIndex, view]);

      const handleAnswerSubmit = (isCorrect) => {
        if (isAnswered) return;
        
        setIsAnswered(true);
        setAnswerResult(isCorrect);

        if (isCorrect) {
          setStats(prev => ({ ...prev, correct: prev.correct + 1 }));
        } else {
          setMissedWords(prev => new Set(prev).add(currentItem.vocab));
          setStats(prev => ({ 
            ...prev, 
            incorrect: prev.incorrect + 1,
            retriesTotal: prev.retriesTotal + 1 
          }));

          // Re-queue 3 to 5 questions ahead
          const retryItem = {
            vocab: currentItem.vocab,
            isRetry: true,
            retryCount: (currentItem.retryCount || 0) + 1,
            qType: currentItem.qType
          };

          const newQueue = [...queue];
          const delay = Math.floor(Math.random() * 3) + 3; 
          const insertPos = Math.min(currentIndex + delay + 1, newQueue.length);
          newQueue.splice(insertPos, 0, retryItem);
          setQueue(newQueue);
        }
      };

      const handleMcqSelect = (option) => {
        setSelectedOption(option);
        handleAnswerSubmit(option.isCorrect);
      };

      const handleTypingSubmit = () => {
        const correctWord = currentItem.vocab.word.toLowerCase().trim();
        const userWord = inputValue.toLowerCase().trim();
        handleAnswerSubmit(userWord === correctWord && userWord.length > 0);
      };

      const handleNextQuestion = () => {
        if (currentIndex + 1 < queue.length) {
          setCurrentIndex(prev => prev + 1);
        } else {
          setView('summary');
        }
      };

      const renderQuestionContent = () => {
        const { vocab, qType } = currentItem;

        if (qType === 'mcq') {
          return (
            <div className="space-y-6 animate-fade-in">
              <div className="text-center space-y-2">
                <div className="flex justify-center items-center gap-2">
                  <span className="text-xs font-bold uppercase tracking-widest text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20">
                    Multiple Choice
                  </span>
                  {currentItem.isRetry && (
                    <span className="text-xs font-bold uppercase tracking-widest text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">
                      🔁 Spaced Practice
                    </span>
                  )}
                </div>
                <h3 className="text-3xl md:text-4xl font-extrabold text-white tracking-tight pt-2">
                  {mode === 'en-vi' ? vocab.word : vocab.vietnamese}
                </h3>
                <p className="text-sm text-slate-400">Choose the correct {mode === 'en-vi' ? 'meaning' : 'word'}</p>
              </div>
              <div className="grid grid-cols-1 gap-3">
                {currentOptions.map((opt, idx) => {
                  let btnStyle = "bg-slate-950/80 border-slate-800 text-slate-200 hover:border-slate-700 hover:bg-slate-800/50";
                  let badgeIcon = String.fromCharCode(65 + idx);

                  if (isAnswered) {
                    if (opt.isCorrect) {
                      btnStyle = "bg-emerald-950/90 border-emerald-500 text-emerald-100 font-bold shadow-md shadow-emerald-900/40";
                      badgeIcon = "✓";
                    } else if (selectedOption?.id === opt.id) {
                      btnStyle = "bg-rose-950/90 border-rose-500 text-rose-100 font-bold";
                      badgeIcon = "✕";
                    } else {
                      btnStyle = "bg-slate-950/40 border-slate-900 text-slate-500 opacity-50";
                    }
                  }

                  return (
                    <button
                      key={idx}
                      disabled={isAnswered}
                      onClick={() => handleMcqSelect(opt)}
                      className={`w-full p-4 rounded-2xl border text-left transition flex items-center space-x-3 text-base ${btnStyle}`}
                    >
                      <span className={`w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs shrink-0 ${isAnswered && opt.isCorrect ? 'bg-emerald-500 text-slate-950' : isAnswered && selectedOption?.id === opt.id && !opt.isCorrect ? 'bg-rose-500 text-white' : 'bg-slate-800 text-slate-400'}`}>
                        {badgeIcon}
                      </span>
                      <span className="flex-grow">{opt.text}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          );
        }

        if (qType === 'typing') {
          return (
            <div className="space-y-6 animate-fade-in">
              <div className="text-center space-y-4">
                <div className="flex justify-center items-center gap-2">
                  <span className="text-xs font-bold uppercase tracking-widest text-pink-400 bg-pink-500/10 px-3 py-1 rounded-full border border-pink-500/20">
                    Active Recall: Typing
                  </span>
                  {currentItem.isRetry && (
                    <span className="text-xs font-bold uppercase tracking-widest text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">
                      🔁 Spaced Practice
                    </span>
                  )}
                </div>
                <p className="text-sm text-slate-400 pt-2">Translate to English ({vocab.pos}):</p>
                <h3 className="text-2xl md:text-3xl font-bold text-white leading-snug">
                  {vocab.vietnamese}
                </h3>
              </div>
              <div className="space-y-4 max-w-md mx-auto">
                <input
                  ref={inputRef}
                  type="text"
                  value={inputValue}
                  onChange={e => setInputValue(e.target.value)}
                  disabled={isAnswered}
                  placeholder="Type the English word..."
                  onKeyDown={e => e.key === 'Enter' && !isAnswered && handleTypingSubmit()}
                  className={`w-full bg-slate-950 border-2 rounded-2xl p-5 text-center text-xl font-bold transition focus:outline-none ${isAnswered ? (answerResult ? 'border-emerald-500 text-emerald-400 bg-emerald-950/30' : 'border-rose-500 text-rose-400 bg-rose-950/30') : 'border-slate-700 focus:border-pink-500 text-white'}`}
                />
                {!isAnswered && (
                  <button onClick={handleTypingSubmit} className="w-full py-4 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-2xl transition">
                    Submit Answer
                  </button>
                )}
              </div>
            </div>
          );
        }

        if (qType === 'fill') {
          const regex = new RegExp(`\\b${vocab.word}\\b`, 'gi');
          const maskedSentence = vocab.example.replace(regex, '________');
          
          return (
            <div className="space-y-6 animate-fade-in">
              <div className="text-center space-y-4">
                <div className="flex justify-center items-center gap-2">
                  <span className="text-xs font-bold uppercase tracking-widest text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">
                    Active Recall: Context
                  </span>
                  {currentItem.isRetry && (
                    <span className="text-xs font-bold uppercase tracking-widest text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">
                      🔁 Spaced Practice
                    </span>
                  )}
                </div>
                <p className="text-sm text-slate-400 pt-2">Fill in the missing word ({vocab.pos}):</p>
                <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                  <h3 className="text-xl md:text-2xl font-medium text-slate-200 leading-relaxed italic">
                    "{maskedSentence}"
                  </h3>
                  <p className="text-sm text-slate-500 mt-4 border-t border-slate-800 pt-3">
                    👉 {vocab.exampleVi}
                  </p>
                </div>
              </div>
              <div className="space-y-4 max-w-md mx-auto">
                <input
                  ref={inputRef}
                  type="text"
                  value={inputValue}
                  onChange={e => setInputValue(e.target.value)}
                  disabled={isAnswered}
                  placeholder="Type the exact word..."
                  onKeyDown={e => e.key === 'Enter' && !isAnswered && handleTypingSubmit()}
                  className={`w-full bg-slate-950 border-2 rounded-2xl p-4 text-center text-xl font-bold transition focus:outline-none ${isAnswered ? (answerResult ? 'border-emerald-500 text-emerald-400' : 'border-rose-500 text-rose-400') : 'border-slate-700 focus:border-amber-500 text-white'}`}
                />
                {!isAnswered && (
                  <button onClick={handleTypingSubmit} className="w-full py-4 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-2xl transition">
                    Submit Answer
                  </button>
                )}
              </div>
            </div>
          );
        }

        if (qType === 'flashcard') {
          const frontText = mode === 'en-vi' ? vocab.word : vocab.vietnamese;
          const backText = mode === 'en-vi' ? vocab.vietnamese : vocab.word;

          return (
            <div className="space-y-6 animate-fade-in">
              <div className="text-center space-y-4">
                <span className="text-xs font-bold uppercase tracking-widest text-cyan-400 bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">
                  Active Recall: Flashcard
                </span>
                <div className="min-h-[200px] flex flex-col items-center justify-center bg-slate-950 border border-slate-700 rounded-3xl p-8 cursor-pointer relative overflow-hidden" onClick={() => !flashcardRevealed && setFlashcardRevealed(true)}>
                  {!flashcardRevealed ? (
                    <div className="text-center space-y-4">
                      <p className="text-sm text-slate-500">What is the meaning of...</p>
                      <h3 className="text-4xl font-extrabold text-white">{frontText}</h3>
                      <p className="text-xs text-slate-500 mt-4 animate-pulse">Tap to reveal answer</p>
                    </div>
                  ) : (
                    <div className="text-center space-y-6 animate-pop w-full">
                      <div className="space-y-1">
                        <span className="text-xs text-slate-500">Front: {frontText}</span>
                        <h3 className="text-3xl font-bold text-cyan-300">{backText}</h3>
                      </div>
                      
                      {!isAnswered && (
                        <div className="pt-4 space-y-3 w-full">
                          <p className="text-sm text-slate-400">Did you remember it correctly?</p>
                          <div className="grid grid-cols-2 gap-3">
                            <button onClick={(e) => { e.stopPropagation(); handleAnswerSubmit(false); }} className="py-3.5 bg-rose-950/60 hover:bg-rose-900 border border-rose-500/50 text-rose-200 font-bold rounded-xl transition">
                              No, I forgot
                            </button>
                            <button onClick={(e) => { e.stopPropagation(); handleAnswerSubmit(true); }} className="py-3.5 bg-emerald-950/60 hover:bg-emerald-900 border border-emerald-500/50 text-emerald-200 font-bold rounded-xl transition">
                              Yes, I knew it!
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }
      };

      return (
        <div className="max-w-3xl w-full mx-auto p-4 md:p-6 flex flex-col flex-grow">
          
          {}
          {!isAppReady && (
            <div className="fixed inset-0 bg-slate-950/90 z-50 flex flex-col items-center justify-center space-y-4 backdrop-blur-sm">
              <div className="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
              <p className="text-slate-300 font-semibold animate-pulse">Syncing with cloud...</p>
            </div>
          )}

          {notification && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-2xl shadow-2xl border text-sm font-semibold animate-pop flex items-center space-x-2 ${
              notification.type === 'error' ? 'bg-rose-950/90 border-rose-500 text-rose-200' : 'bg-emerald-950/90 border-emerald-500 text-emerald-200'
            }`}>
              <span>{notification.msg}</span>
            </div>
          )}

          <header className="flex justify-between items-center py-4 border-b border-slate-800 mb-6">
            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('welcome')}>
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-pink-600 flex items-center justify-center shadow-lg font-bold text-white text-xl">🧠</div>
              <div>
                <h1 className="font-bold text-lg text-white leading-tight">Active Recall Vocab</h1>
                <p className="text-xs text-slate-400">Folder & Lesson Master</p>
              </div>
            </div>
            <div className="flex items-center space-x-2">
              {view !== 'welcome' && (
                <button onClick={() => setView('welcome')} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
                  Main Menu
                </button>
              )}
            </div>
          </header>

          <main className="flex-grow flex flex-col justify-center">

            {/* WELCOME / SETTINGS VIEW */}
            {view === 'welcome' && (
              <div className="animate-pop bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-10 shadow-2xl space-y-8 max-w-2xl mx-auto w-full">
                <div className="text-center space-y-3">
                  <h2 className="text-2xl md:text-3xl font-extrabold text-white">Study Session Setup</h2>
                  <p className="text-slate-400 text-sm max-w-md mx-auto">
                    Organize your vocabulary into folders, select a lesson, and test your memory.
                  </p>
                </div>

                <div className="space-y-6 bg-slate-950/60 p-5 rounded-2xl border border-slate-800/80">
                  
                  {/* Lesson / Folder Selector */}
                  <div>
                    <div className="flex justify-between items-center mb-2">
                      <label className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <span>📂</span> Select Lesson / Folder
                      </label>
                      <button onClick={() => setView('manage-folders')} className="text-xs text-indigo-400 hover:text-indigo-300 font-semibold underline">
                        Manage Folders ({customLessons.length + 1})
                      </button>
                    </div>
                    <select 
                      value={selectedLessonId}
                      onChange={(e) => setSelectedLessonId(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white font-medium focus:outline-none focus:border-indigo-500"
                    >
                      <option value="all">🌐 All Folders Combined ({allLessons.reduce((acc, l) => acc + l.words.length, 0)} words)</option>
                      {allLessons.map(lesson => (
                        <option key={lesson.id} value={lesson.id}>
                          {lesson.isDefault ? '⭐ ' : '📁 '}{lesson.title} ({lesson.words.length} words)
                        </option>
                      ))}
                    </select>
                  </div>

                  {/* Mode Selector */}
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2 flex items-center gap-2">
                      <span>🎯</span> Question Style
                    </label>
                    <select 
                      value={quizStyle}
                      onChange={(e) => setQuizStyle(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white font-medium focus:outline-none focus:border-indigo-500"
                    >
                      <option value="mixed">🧠 Mixed Mastery (All Types Randomly)</option>
                      <option value="mcq">🔘 Multiple Choice Only</option>
                      <option value="typing">⌨️ Active Recall: Typing / Translation</option>
                      <option value="fill">📝 Active Recall: Fill in the Blanks</option>
                      <option value="flashcard">🃏 Active Recall: Self-Graded Flashcards</option>
                    </select>
                  </div>

                  {/* Count Settings */}
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Session Word Count</label>
                    <select value={countOption} onChange={(e) => setCountOption(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none">
                      <option value="15">Quick Session (15 words)</option>
                      <option value="30">Standard Session (30 words)</option>
                      <option value="all">Marathon (All available words in lesson)</option>
                    </select>
                  </div>
                </div>

                <div className="space-y-3">
                  <button onClick={startQuiz} className="w-full py-4 bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-bold rounded-2xl shadow-xl shadow-pink-500/20 transition transform active:scale-95 text-lg flex items-center justify-center gap-2">
                    <span>🚀</span> Start Learning Now
                  </button>

                  <div className="grid grid-cols-2 gap-3 pt-2">
                    <button onClick={() => setView('manage-folders')} className="py-3 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-2xl transition border border-slate-700 flex justify-center items-center gap-2 text-sm">
                      <span>📂</span> Manage Folders
                    </button>
                    <button onClick={() => setView('add-vocab')} className="py-3 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-2xl transition border border-slate-700 flex justify-center items-center gap-2 text-sm">
                      <span>➕</span> Add Vocab
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* FOLDER & LESSON MANAGER VIEW */}
            {view === 'manage-folders' && (
              <div className="animate-pop bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6 max-w-2xl mx-auto w-full">
                <div className="flex justify-between items-center pb-4 border-b border-slate-800">
                  <div>
                    <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                      <span>📂</span> Lesson & Folder Manager
                    </h2>
                    <p className="text-xs text-slate-400">Create folders and group your vocabulary by lesson.</p>
                  </div>
                  <button onClick={() => { setView('welcome'); setInspectedFolderId(null); }} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-semibold text-white transition">
                    Done
                  </button>
                </div>

                {/* Create New Folder Form */}
                <form onSubmit={handleCreateFolder} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                  <label className="text-xs font-bold uppercase tracking-wider text-slate-400">Create New Lesson / Folder</label>
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      value={newFolderName}
                      onChange={e => setNewFolderName(e.target.value)}
                      placeholder="e.g. Lesson 2: Technology, IELTS Band 7..."
                      className="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                    />
                    <button type="submit" className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-sm transition shrink-0">
                      Create
                    </button>
                  </div>
                </form>

                {/* List of Folders */}
                <div className="space-y-4">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">Your Lesson Folders ({allLessons.length})</h3>
                  <div className="grid grid-cols-1 gap-3">
                    {allLessons.map(folder => {
                      const isInspected = inspectedFolderId === folder.id;
                      return (
                        <div key={folder.id} className="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden transition">
                          <div className="p-4 flex items-center justify-between">
                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setInspectedFolderId(isInspected ? null : folder.id)}>
                              <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-bold text-lg ${folder.isDefault ? 'bg-amber-500/20 text-amber-400' : 'bg-indigo-500/20 text-indigo-400'}`}>
                                {folder.isDefault ? '⭐' : '📁'}
                              </div>
                              <div>
                                <h4 className="font-bold text-white text-base">{folder.title}</h4>
                                <p className="text-xs text-slate-400">{folder.words.length} vocabulary words</p>
                              </div>
                            </div>
                            <div className="flex items-center space-x-2">
                              <button 
                                onClick={() => setInspectedFolderId(isInspected ? null : folder.id)}
                                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-semibold transition"
                              >
                                {isInspected ? 'Hide Words' : 'View Words'}
                              </button>
                              {!folder.isDefault && (
                                <button 
                                  onClick={() => handleDeleteFolder(folder.id)}
                                  className="p-1.5 text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 rounded-lg transition"
                                  title="Delete Folder"
                                >
                                  🗑️
                                </button>
                              )}
                            </div>
                          </div>

                          {/* Expanded Word Inspector */}
                          {isInspected && (
                            <div className="bg-slate-900/80 p-4 border-t border-slate-800/80 space-y-3 animate-fade-in">
                              <div className="flex justify-between items-center pb-2">
                                <span className="text-xs font-bold text-slate-400 uppercase">Words in {folder.title}</span>
                                {!folder.isDefault && (
                                  <button 
                                    onClick={() => { setTargetFolderId(folder.id); setView('add-vocab'); }}
                                    className="text-xs font-semibold text-indigo-400 hover:text-indigo-300"
                                  >
                                    + Add Word To This Folder
                                  </button>
                                )}
                              </div>
                              {folder.words.length === 0 ? (
                                <p className="text-xs text-slate-500 italic py-2">No words added to this folder yet.</p>
                              ) : (
                                <div className="max-h-56 overflow-y-auto space-y-2 pr-1">
                                  {folder.words.map((w) => (
                                    <div key={w.id} className="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800/60 text-sm">
                                      <div>
                                        <span className="font-bold text-slate-200">{w.word}</span> <span className="text-xs text-slate-500 italic">({w.pos})</span>
                                        <p className="text-xs text-slate-400">{w.vietnamese}</p>
                                      </div>
                                      {!folder.isDefault && (
                                        <button 
                                          onClick={() => handleDeleteWordFromFolder(folder.id, w.id)}
                                          className="text-xs text-rose-500 hover:text-rose-400 p-1"
                                          title="Remove Word"
                                        >
                                          ✕
                                        </button>
                                      )}
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* ADD CUSTOM VOCAB VIEW */}
            {view === 'add-vocab' && (
              <div className="animate-pop bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6 max-w-2xl mx-auto w-full">
                <div className="flex justify-between items-center pb-4 border-b border-slate-800">
                  <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                    <span>➕</span> Add New Vocabulary
                  </h2>
                  <button onClick={() => setView('welcome')} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-semibold text-white transition">
                    Back
                  </button>
                </div>

                <form onSubmit={handleAddCustomWord} className="space-y-4">
                  
                  {/* Select Destination Folder */}
                  <div className="space-y-1">
                    <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Select Folder / Lesson *</label>
                    <select 
                      value={targetFolderId} 
                      onChange={e => setTargetFolderId(e.target.value)} 
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500"
                    >
                      {customLessons.map(folder => (
                        <option key={folder.id} value={folder.id}>📁 {folder.title}</option>
                      ))}
                      <option value="new">➕ Create New Folder Automatically...</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="space-y-1">
                      <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Word *</label>
                      <input required type="text" value={newWord} onChange={e => setNewWord(e.target.value)} placeholder="e.g. satellite" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500" />
                    </div>
                    <div className="space-y-1">
                      <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Part of Speech *</label>
                      <select value={newPos} onChange={e => setNewPos(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
                        <option value="noun">Noun (Danh từ)</option>
                        <option value="verb">Verb (Động từ)</option>
                        <option value="adj">Adjective (Tính từ)</option>
                        <option value="adv">Adverb (Trạng từ)</option>
                        <option value="idiom">Idiom (Thành ngữ)</option>
                      </select>
                    </div>
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Meaning in Vietnamese *</label>
                    <input required type="text" value={newVietnamese} onChange={e => setNewVietnamese(e.target.value)} placeholder="e.g. vệ tinh" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500" />
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider flex justify-between">
                      <span>Example Sentence (English)</span>
                      <span className="text-slate-600">Optional</span>
                    </label>
                    <input type="text" value={newExample} onChange={e => setNewExample(e.target.value)} placeholder="e.g. The satellite orbits the planet." className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500" />
                  </div>

                  <div className="space-y-1">
                    <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider flex justify-between">
                      <span>Example Translation (Vietnamese)</span>
                      <span className="text-slate-600">Optional</span>
                    </label>
                    <input type="text" value={newExampleVi} onChange={e => setNewExampleVi(e.target.value)} placeholder="e.g. Vệ tinh quay quanh hành tinh." className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500" />
                  </div>

                  <button type="submit" className="w-full py-3.5 mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition shadow-lg flex justify-center items-center space-x-2">
                    <span>Save Word to Folder</span>
                  </button>
                </form>
              </div>
            )}

            {/* ACTIVE QUIZ VIEW */}
            {view === 'quiz' && currentItem && (
              <div className="space-y-6 max-w-2xl mx-auto w-full">
                
                {/* Progress Bar */}
                <div className="space-y-2">
                  <div className="flex justify-between items-center text-xs font-semibold text-slate-400">
                    <span className="bg-slate-800 px-3 py-1 rounded-lg text-slate-300">
                      Question {currentIndex + 1} of {queue.length}
                    </span>
                    <div className="flex space-x-3">
                      <span className="text-emerald-400 font-bold">✓ {stats.correct}</span>
                      {stats.retriesTotal > 0 && <span className="text-rose-400 font-bold">✕ {stats.incorrect}</span>}
                    </div>
                  </div>
                  <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                    <div className="h-full bg-gradient-to-r from-indigo-500 to-pink-500 transition-all duration-300" style={{ width: `${((currentIndex + 1) / queue.length) * 100}%` }}></div>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
                  
                  {renderQuestionContent()}

                  {/* RESULT EXPLANATION BOX */}
                  {isAnswered && (
                    <div className="animate-fade-in space-y-5 pt-6 border-t border-slate-800/80">
                      
                      {!answerResult && (
                         <div className="bg-rose-500/10 border border-rose-500/20 rounded-xl p-3 flex items-center space-x-3 text-rose-300 text-sm">
                           <span className="text-xl">🔁</span>
                           <p><strong>Incorrect.</strong> This word has been added back to your queue for extra practice.</p>
                         </div>
                      )}

                      <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 md:p-5 space-y-3">
                        <div className="flex justify-between border-b border-slate-800/80 pb-2.5">
                          <div className="flex items-baseline space-x-2">
                            <span className="text-lg font-bold text-indigo-300">{currentItem.vocab.word}</span>
                            <span className="text-xs text-slate-500 italic">({currentItem.vocab.pos})</span>
                          </div>
                          <span className="text-sm font-semibold text-emerald-400">{currentItem.vocab.vietnamese}</span>
                        </div>
                        <div className="space-y-1">
                          <p className="text-sm text-slate-300 font-medium italic">"{currentItem.vocab.example}"</p>
                          <p className="text-xs text-slate-500">👉 {currentItem.vocab.exampleVi}</p>
                        </div>
                      </div>

                      <button onClick={handleNextQuestion} className="w-full py-4 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-2xl transition flex justify-center items-center space-x-2">
                        <span>Continue</span> <span>➔</span>
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* SUMMARY VIEW */}
            {view === 'summary' && (
              <div className="animate-pop bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-10 shadow-2xl space-y-8 max-w-xl mx-auto w-full text-center">
                <div className="space-y-3">
                  <div className="text-5xl mb-4">🏆</div>
                  <h2 className="text-3xl font-extrabold text-white">Session Complete!</h2>
                  <p className="text-slate-400 text-sm">You actively recalled {stats.correct} words.</p>
                </div>
                <button onClick={() => setView('welcome')} className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl transition shadow-lg">
                  Back to Main Menu
                </button>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
